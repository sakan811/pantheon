# Keeps the SHA-pinned actions in .github/workflows up to date. JUCE is fetched by CMake (FetchContent) and is not
# covered by Dependabot; bump its tag by hand (see cmake/Juce.cmake).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
